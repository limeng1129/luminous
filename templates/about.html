{% extends "base.html" %}
{% block title %}关于 · 流光{% endblock %}
{% block body %}
<main class="about">
  <span class="label">About</span>
  <h1>一个安静的地方</h1>
  <p>流光用来放两样东西：走过的路，和路上想到的事。偶尔还有一些照片，是当时舍不得放下相机的那几秒。</p>
  <p>这里没有推荐算法，没有让你天天回来的提醒。写得慢，也读得慢。</p>
  <p class="dim">照片按原图存放，点开可以放大看细节。文字用宋体排版，是因为有些句子值得被慢慢看完。</p>
  <hr class="a-rule">
  <p class="dim">如果你也在某个地方看到过很好的光，欢迎写下来。</p>
  <a class="btn-line dark" href="/compose">写一篇</a>
</main>
{% endblock %}
