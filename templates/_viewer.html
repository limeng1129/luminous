<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="查看照片">
  <span class="v-count" id="vCount"></span>
  <button class="v-btn v-close" id="vClose" aria-label="关闭">
    <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  <button class="v-btn v-prev" id="vPrev" aria-label="上一张">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
  <button class="v-btn v-next" id="vNext" aria-label="下一张">
    <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
  <img class="viewer-img" id="vImg" src="" alt="">
  <div class="viewer-bar" id="vBar">
    <div><b id="vTitle"></b><span id="vSub"></span></div>
    <div class="hint">点图放大 · 方向键切换 · Esc 退出</div>
  </div>
</div>
